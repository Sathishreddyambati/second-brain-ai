<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Second Brain AI</title>

<link rel="stylesheet" href="style.css">

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js"></script>
</head>

<body>

<div class="container">

    <h1>🧠 Second Brain</h1>
    <p class="tag">Never forget anything again</p>

    <!-- MIC -->
    <div class="mic" onclick="startListening()">🎤</div>

    <!-- INPUT -->
    <div class="input-box">
        <input type="text" id="userInput" placeholder="Ask or save something...">
        <button onclick="handleInput()">Ask</button>
    </div>

    <!-- RESULT -->
    <p id="result"></p>

</div>

<script src="app.js"></script>

</body>
</html>
